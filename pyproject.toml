[project]
name = "diabetes-readmission"
version = "0.1.0"
description = "Predicting 30-day hospital readmission using the UCI Diabetes 130-US Hospitals dataset"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
